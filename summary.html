<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Recap — Riassunto</title>
  <link rel="stylesheet" href="summary.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⚡ DeepSeek Recap</div>
    <a id="page-link" class="source" target="_blank" rel="noopener">Apri pagina originale ↗</a>
  </header>
  <main>
    <h1 id="recap-header">Riassunto</h1>

    <div id="recap-body" class="recap-body">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>DeepSeek sta riassumendo il contenuto…</p>
      </div>

      <div id="summary" class="summary hidden"></div>

      <div id="error" class="error hidden"></div>

      <div id="empty" class="empty hidden">
        <p>Nessun contenuto da riassumere.</p>
        <p>
          Seleziona del testo su una pagina web, fai tasto destro e scegli
          <strong>“Riassumi la selezione con DeepSeek”</strong>.
        </p>
      </div>
    </div>

    <div class="actions">
      <button id="btn-copy" class="hidden">📋 Copia riassunto</button>
      <button id="btn-retry" class="hidden">🔄 Riprova</button>
      <button id="btn-open-page" class="hidden">↗ Apri pagina originale</button>
    </div>
  </main>
  <script src="summary.js"></script>
</body>
</html>
